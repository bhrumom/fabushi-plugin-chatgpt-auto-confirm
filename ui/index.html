<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>ChatGPT 自动确认</title><style>body{font:16px system-ui;margin:0;padding:2rem;max-width:48rem}article{padding:1.25rem;border:1px solid #ddd;border-radius:1rem}</style></head><body><article><h1>ChatGPT 自动确认</h1><p>插件总控可见或隐藏的专用 ChatGPT Chat。每轮由 Work Chat 直接执行并返回自然语言结果；插件把结果交给新开的规划/验收 Chat，只有规划 Chat 输出 MAHAYANA_TASK_REPORT_V1。未完成时，插件把 next_task 原文发送到新的 Work Chat，Work Chat 不会收到回执模板；重试会先关闭旧的插件目标并重建。插件固定验证 Chat、GPT-5.6 Sol 与 Extra High，并自动确认授权卡。最多两个隔离任务可同时运行，任务状态和会话边界可恢复。</p></article></body></html>
