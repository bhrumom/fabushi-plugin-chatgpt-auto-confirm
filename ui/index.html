<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>ChatGPT 自动确认</title><style>body{font:16px system-ui;margin:0;padding:2rem;max-width:48rem}article{padding:1.25rem;border:1px solid #ddd;border-radius:1rem}</style></head><body><article><h1>ChatGPT 自动确认</h1><p>每次使用 dispatch-goal 提交一条完整总目标；最多两个独立目标可同时运行，各自拥有隔离的内置 Browser 标签页和持久恢复链路。插件固定选择 Chat、GPT-5.6 Sol 与 Extra High，后台检测并自动批准授权卡：优先选择“允许本次会话”，没有该选项时直接点击“允许”。只有完整完成回执和验证证据才会停止；未完成时只在对应标签页续作，失效标签页和执行租约由长期宿主泵自动恢复；不会切换到 Work/worker、Devspace 或通用 CDP。</p></article></body></html>
